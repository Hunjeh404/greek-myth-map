<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content">
<title>그리스 신화 관계도</title>
<meta name="description" content="그리스 신화의 신·영웅·괴물을 검색하고 관계도로 탐색하는 앱">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FBF6E8">
<link rel="icon" href="images/ui/favicon.png">
<meta property="og:title" content="그리스 신화 관계도">
<meta property="og:description" content="신·영웅·괴물을 검색하고 관계도로 탐색해 보세요">
<meta property="og:image" content="images/ui/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Brush+Script&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{
  /* 스타일 시트 주요 색상 */
  --cream:#EDE7D6; --mint:#C7E1D7; --salmon:#F1C7A4; --lav:#DCCFE5; --blue:#BDCFE0; --gold:#F0DEAA; --white:#FFF8DC;
  /* 그림자·재질 */
  --mint-d:#A6C6B8; --salmon-d:#E8A777; --lav-d:#B6B1C4; --blue-d:#97AEC4; --gray:#C8CCD6; --wood:#B8A07A; --ink:#3A3739;
  /* 보조색 */
  --navy:#49536D; --navy-d:#2E3A57; --khaki:#C7B890;
  --paper:#FBF6E8; --line:rgba(58,55,57,.18); --muted:#5F5955;
  --radius:18px; --shadow:0 2px 0 rgba(58,55,57,.08),0 8px 24px rgba(58,55,57,.08);
  --font:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --hand:"Nanum Pen Script","Gowun Dodum",cursive;
  --brush:"Nanum Brush Script","Nanum Pen Script",cursive;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  font-family:var(--font);color:var(--ink);
  background:url(images/ui/bg.png) repeat, var(--cream);
  background-size:512px auto, auto;
  overflow:hidden; -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.app{display:grid;grid-template-rows:auto 1fr;position:fixed;top:0;left:0;right:0;height:100%;height:100dvh}

/* 헤더 */
header{
  position:relative;z-index:30;display:flex;align-items:center;gap:14px;
  padding:10px 18px;border-bottom:1.5px solid var(--line);
  background:linear-gradient(rgba(251,246,232,.72),rgba(251,246,232,.72)), url(images/ui/header.png) center/cover no-repeat, var(--paper);
}
.brand{display:flex;align-items:center;gap:8px;cursor:pointer;flex-shrink:0;border:0;background:none;padding:0}
.brand .logo{width:40px;height:40px;border-radius:50%;background:var(--gold);display:grid;place-items:center;overflow:hidden;border:1.5px solid var(--ink)}
.brand .logo img{width:100%;height:100%;object-fit:cover}
.brand h1{margin:0;font-family:var(--brush);font-size:30px;font-weight:400;letter-spacing:1px;line-height:1;white-space:nowrap}
.brand small{display:block;font-family:var(--hand);font-size:16px;color:var(--muted);letter-spacing:0}

.search{position:relative;flex:1;max-width:560px}
.search input{
  width:100%;height:44px;border-radius:22px;border:1.5px solid var(--ink);background:var(--white);
  padding:0 44px 0 44px;font:inherit;font-size:16px;color:var(--ink);outline:none;
  box-shadow:0 3px 0 rgba(58,55,57,.12);
}
.search input:focus{box-shadow:0 0 0 4px rgba(151,174,196,.35),0 3px 0 rgba(58,55,57,.12)}
.search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;pointer-events:none}
.search .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:0;background:transparent;display:none}
.search .clear.on{display:block}
.suggest{
  position:absolute;left:0;right:0;top:50px;background:var(--paper);border:1.5px solid var(--ink);border-radius:16px;
  box-shadow:var(--shadow);overflow:hidden;display:none;max-height:min(70vh,560px);overflow-y:auto;
}
.suggest.on{display:block}
.suggest .hint{padding:10px 14px;font-size:13px;color:var(--muted);border-bottom:1px dashed var(--line)}
.sg{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;border-bottom:1px solid rgba(58,55,57,.06)}
.sg:last-child{border-bottom:0}
.sg.act,.sg:hover{background:var(--gold)}
.sg .av{width:40px;height:40px;flex-shrink:0}
.sg .nm{font-size:16px;font-weight:700}
.sg .nm mark{background:var(--mint);color:inherit;border-radius:4px;padding:0 1px}
.sg .sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg .why{margin-left:auto;font-size:12px;padding:2px 8px;border-radius:10px;background:var(--lav);white-space:nowrap}
.sg .tx{min-width:0}
.hbtns{display:flex;gap:6px;margin-left:auto}
.ibtn{
  height:44px;min-width:44px;padding:0 12px;border-radius:22px;border:1.5px solid var(--ink);background:var(--white);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;box-shadow:0 2px 0 rgba(58,55,57,.12)
}
.ibtn:hover{background:var(--gold)}
.ibtn:active{transform:translateY(1px);box-shadow:none}
.ibtn svg,.ibtn img{width:18px;height:18px}
.ibtn .lbl{white-space:nowrap}

/* 본문 */
main{position:relative;display:grid;grid-template-columns:1fr 400px;min-height:0}
main.nopanel{grid-template-columns:1fr}
.panel.hidden{display:none}
main.nopanel .zoom{top:14px;bottom:auto;z-index:6}
main.nopanel .zoom .ibtn:not(.sndbtn){display:none}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden}
#graph{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#graph.drag{cursor:grabbing}
.toolbar{position:absolute;left:14px;top:12px;right:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;z-index:5;pointer-events:none}
.toolbar > *{pointer-events:auto}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 13px;border-radius:19px;border:1.5px solid var(--ink);
  background:var(--white);font-size:13px;user-select:none;box-shadow:0 2px 0 rgba(58,55,57,.1)
}
.chip .dot{width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.25)}
.chip.off{opacity:.42;text-decoration:line-through}
.chip b{font-weight:400;color:var(--muted)}
.toggle{background:var(--lav)}
.toggle.on{background:var(--navy);color:#fff}
.zoom{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:5}
.crumbs{position:absolute;left:14px;bottom:14px;display:flex;gap:4px;flex-wrap:wrap;max-width:calc(100% - 90px);z-index:5}
.crumb{border:0;background:rgba(251,246,232,.9);border-radius:12px;padding:4px 10px;font-size:13px;border:1px solid var(--line)}
.crumb.cur{background:var(--gold);border-color:var(--ink)}
.crumbs .sep{align-self:center;color:var(--muted);font-size:12px}

/* 노드 */
.node{cursor:pointer}
.node .ring{fill:var(--white);stroke:var(--ink);stroke-width:1.6}
.node .nm{font-family:var(--font);font-size:calc(14px * var(--ts,1));font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
.node .tag{font-family:var(--font);font-size:calc(12px * var(--ts,1));paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round}
.node.center .nm{font-size:calc(18px * var(--ts,1))}
#graph.far .node:not(.center) .tag{display:none}
.node .hit{fill:transparent;stroke:none}
.node:hover .ring,.node:focus .ring{stroke-width:3}
.node:focus{outline:none}
.node:focus-visible .ring{stroke:#C9A43A;stroke-width:5}
button:focus-visible,[role=button]:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #C9A43A;outline-offset:2px}
.search input:focus-visible,.qr input:focus-visible,.sheet .top input:focus-visible{outline:3px solid #C9A43A;outline-offset:1px}
.node .pop{animation:pop .45s cubic-bezier(.3,1.5,.5,1) both}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.edge{fill:none;stroke-width:2.2;stroke-linecap:round;opacity:.85;animation:fadein .5s both}
.edge.v{stroke-dasharray:6 6;opacity:.6}
.edge.hl{stroke-width:4;opacity:1}
@keyframes fadein{from{opacity:0}}
.more .ring{fill:var(--gold)}
.sector-label{font-family:var(--hand);font-size:calc(22px * min(var(--ts,1), 1.4));fill:var(--muted)}

/* 상세 패널 */
.panel{
  position:relative;border-left:1.5px solid var(--line);background:rgba(251,246,232,.94);overflow-y:auto;
  padding:18px 18px 40px;min-height:0
}
.panel .grab{display:none}
.hero{display:flex;gap:14px;align-items:center}
.portrait{position:relative;width:118px;height:118px;flex-shrink:0}
.portrait .av{width:100%;height:100%}
.portrait .frame{position:absolute;inset:-10%;width:120%;height:120%;pointer-events:none}
.hero h2{margin:0;font-size:26px;line-height:1.15}
.hero .en{font-size:13px;color:var(--muted);margin-top:3px}
.catb{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:12.5px;padding:3px 10px;border-radius:12px;border:1px solid var(--ink)}
.catb img{width:16px;height:16px}
.dom{font-family:var(--hand);font-size:22px;margin:14px 0 6px;color:var(--navy)}
.syms{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.syms span{font-size:12.5px;padding:3px 9px;border-radius:10px;background:var(--gold);border:1px solid rgba(58,55,57,.2)}
.ep{
  background:var(--white);border:1.5px solid var(--ink);border-radius:var(--radius);padding:14px 15px;line-height:1.7;font-size:15px;
  position:relative;box-shadow:0 3px 0 rgba(58,55,57,.1)
}
.ep h4{margin:14px 0 4px;font-family:var(--hand);font-weight:400;font-size:21px;color:var(--navy);line-height:1.2}
.ep h4:first-child{margin-top:4px}
.ep p{margin:0}
.ep .sl{border:0;background:none;padding:0;font:inherit;color:inherit;text-decoration:underline;text-decoration-style:dotted;text-decoration-color:var(--wood);text-underline-offset:3px;cursor:pointer}
.ep .sl:hover{background:var(--gold)}
.fact{margin-top:14px;background:var(--gold);border:1.5px dashed var(--wood);border-radius:14px;padding:10px 12px;font-size:14.5px;line-height:1.65}
.fact b{display:block;font-family:var(--hand);font-weight:400;font-size:19px;color:var(--navy)}
.ep::before{content:"이야기";position:absolute;top:-12px;left:14px;background:var(--salmon);border:1.5px solid var(--ink);border-radius:10px;padding:0 10px;font-family:var(--hand);font-size:18px;line-height:22px}
.aka{font-size:12.5px;color:var(--muted);margin-top:10px}
.rels{margin-top:18px}
.rels h3{font-family:var(--hand);font-weight:400;font-size:22px;margin:16px 0 6px;display:flex;align-items:center;gap:8px}
.rels h3 .dot{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.25)}
.rels h3 small{font-family:var(--font);font-size:12px;color:var(--muted)}
.rl{display:flex;flex-wrap:wrap;gap:6px}
.rp{min-height:40px;display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 5px;border-radius:18px;border:1px solid rgba(58,55,57,.25);background:var(--white);font-size:13.5px;cursor:pointer;max-width:100%}
.rp:hover{background:var(--gold)}
.rp .av{width:26px;height:26px;flex-shrink:0}
.rp .n{font-size:12.5px;color:var(--muted)}
.rp.v{border-style:dashed}
.rp .vb{font-size:12px;background:var(--lav);border-radius:6px;padding:0 4px}
.note{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.5}

/* 아바타 */
.av{border-radius:50%;overflow:hidden;position:relative;display:grid;place-items:center;border:1.5px solid var(--ink);background:var(--mint)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av .ini{font-family:var(--hand);line-height:1;color:var(--ink)}

/* 환영 화면 */
.welcome{position:absolute;inset:0;display:grid;place-items:center;padding:20px;z-index:4;overflow-y:auto}
.welcome .box{max-width:620px;text-align:center}
.welcome .art{width:min(280px,60vw);aspect-ratio:1;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,var(--white),var(--gold) 70%);border:1.5px solid var(--ink);overflow:hidden}
.welcome .art img{width:100%;height:100%;object-fit:cover}
.welcome .art .fb{font-family:var(--brush);font-size:84px;color:var(--navy)}
.welcome h2{font-family:var(--brush);font-weight:400;font-size:44px;margin:10px 0 0}
.welcome p{font-family:var(--hand);font-size:22px;color:var(--muted);margin:4px 0 16px}
.welcome .tips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 18px;font-size:13.5px}
.welcome .tips span{background:var(--white);border:1px dashed var(--ink);border-radius:12px;padding:5px 10px}
.welcome .tips code{font-family:inherit;background:var(--mint);border-radius:6px;padding:0 5px}
.feat{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.feat button{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border-radius:20px;border:1.5px solid var(--ink);background:var(--white);font-size:14px}
.feat button:hover{background:var(--gold)}
.feat .av{width:30px;height:30px}

/* 목록 모달 */
.modal{position:fixed;inset:0;background:rgba(58,55,57,.35);display:none;z-index:50;padding:24px}
.modal.on{display:grid;place-items:center}
.sheet{width:min(920px,100%);max-height:100%;background:var(--paper);border:1.5px solid var(--ink);border-radius:22px;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
.sheet .top{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1.5px solid var(--line)}
.sheet .top h2{margin:0;font-family:var(--brush);font-weight:400;font-size:30px}
.sheet .top input{flex:1;height:36px;border-radius:18px;border:1.5px solid var(--ink);background:var(--white);padding:0 14px;font:inherit;outline:none;min-width:0}
.sheet .body{overflow-y:auto;padding:6px 16px 24px}
.sheet h3{font-family:var(--hand);font-weight:400;font-size:24px;margin:14px 0 6px;display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.grid button{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 4px;border-radius:14px;border:1px solid rgba(58,55,57,.2);background:var(--white);text-align:left;font-size:14px;min-width:0}
.grid button:hover{background:var(--gold)}
.grid .av{width:32px;height:32px;flex-shrink:0}
.grid span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:#fff;font-size:12.5px;padding:6px 9px;border-radius:8px;max-width:260px;line-height:1.45;display:none}

/* 모바일 */
@media (max-width:900px){
  header{flex-wrap:wrap;padding:8px 12px;gap:8px}
  .brand h1{font-size:24px}.brand small{display:none}
  .brand .logo{width:34px;height:34px}
  .search{order:3;flex-basis:100%;max-width:none}
  .ibtn .lbl{display:none}
  main{grid-template-columns:1fr}
  .panel{
    position:absolute;left:0;right:0;bottom:0;height:46%;border-left:0;border-top:1.5px solid var(--ink);
    border-radius:22px 22px 0 0;z-index:20;transition:height .25s ease;box-shadow:0 -6px 20px rgba(58,55,57,.12);padding-top:6px
  }
  .panel.min{height:92px;overflow:hidden}
  .panel.max{height:86%}
  .panel .grab{display:block;width:calc(100% + 36px);margin:0 -18px;height:44px;border:0;background:rgba(251,246,232,.96);position:sticky;top:-6px;z-index:2;touch-action:none;cursor:ns-resize}
  .panel .grab::after{content:"";display:block;width:56px;height:6px;border-radius:3px;background:var(--lav-d);margin:14px auto}
  .panel.short{overflow:hidden}
  .panel.hidden{display:none}
  .zoom{bottom:auto;top:58px}
  .toolbar{flex-wrap:nowrap;overflow-x:auto;right:0;padding-right:14px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
  .toolbar::-webkit-scrollbar{display:none}
  .toolbar .chip{flex-shrink:0}
  .crumbs{display:none}
  .portrait{width:84px;height:84px}
  .hero{padding-top:12px} /* 월계수 테두리가 위쪽 손잡이 띠에 가려지지 않게 */
  .hero h2{font-size:22px}
  .modal{padding:0}
  .sheet{border-radius:0;height:100%}
}

/* ---------- 이야기책·퀴즈 공통 오버레이 ---------- */
.ov{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;background:url(images/ui/bg.png) repeat, var(--cream);background-size:512px auto,auto}
.ov.on{display:flex}
.ov .obar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1.5px solid var(--line);background:rgba(251,246,232,.94);flex-shrink:0}
.ov .obar h2{margin:0;flex:1;font-family:var(--brush);font-weight:400;font-size:28px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov .obody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ov .wrap{max-width:760px;margin:0 auto;padding:18px 16px 60px}
.pillbtn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--ink);border-radius:22px;background:var(--white);padding:9px 16px;font-size:15px;box-shadow:0 3px 0 rgba(58,55,57,.12)}
.pillbtn:active{transform:translateY(1px);box-shadow:none}
.pillbtn.pri{background:var(--gold)}
.pillbtn.navy{background:var(--navy);color:var(--white)}
.pillbtn svg{width:18px;height:18px}
.backpill{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:55;display:none;background:var(--navy);color:var(--white);border:1.5px solid var(--ink);border-radius:24px;padding:10px 18px;font-size:15px;box-shadow:0 6px 18px rgba(46,58,87,.3)}
.backpill.on{display:inline-flex;align-items:center;gap:8px}
@media (max-width:900px){.backpill{bottom:auto;top:108px}}

.sndbtn .s-off{display:none}.sndbtn.off .s-on{display:none}.sndbtn.off .s-off{display:block}.sndbtn.off{background:var(--gray)}
#ovBook .obar{position:relative}
.prog{position:absolute;left:0;right:0;bottom:-1.5px;height:4px;display:none}
.prog.on{display:block}
.prog i{display:block;height:100%;width:0;background:var(--navy);border-radius:0 2px 2px 0;transition:width .15s linear}
.tipb{position:fixed;z-index:58;max-width:min(300px,82vw);background:var(--navy);color:var(--white);border-radius:16px;padding:12px 14px 12px 16px;font-size:15px;line-height:1.5;box-shadow:0 8px 24px rgba(46,58,87,.3);display:flex;gap:10px;align-items:flex-start}
.tipb button{flex-shrink:0;border:0;background:var(--gold);color:var(--ink);border-radius:12px;padding:4px 12px;font-size:14px;min-height:44px}
.tipb::after{content:"";position:absolute;width:14px;height:14px;background:var(--navy);transform:rotate(45deg);left:var(--ax,50%);margin-left:-7px}
.tipb.up::after{top:-6px}.tipb.down::after{bottom:-6px}
/* 장면 그림 */
.scene{margin:18px 0;border-radius:18px;overflow:hidden;border:1.5px solid var(--ink);background:var(--white);box-shadow:var(--shadow)}
.scene .pic{position:relative;aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden}
.scene .pic img.full{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scene .faces{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:0;padding:12px;max-width:92%}
.scene .faces .av{width:var(--fs,96px);height:var(--fs,96px);margin:0 -8px;border:2px solid var(--white);box-shadow:0 2px 8px rgba(58,55,57,.18)}
.scene .faces .av .ini{font-size:40px!important}
.scene figcaption{font-family:var(--hand);font-size:20px;line-height:1.25;padding:8px 14px 10px;background:var(--paper);border-top:1.5px dashed var(--line);color:var(--navy)}
.scene.soon figcaption::after{content:" · 그림 준비 중";font-family:var(--font);font-size:12px;color:var(--muted)}

/* 이야기책 */
.bk-hero{text-align:center;margin:4px 0 18px}
.bk-hero h3{font-family:var(--brush);font-weight:400;font-size:40px;margin:0}
.bk-hero p{font-family:var(--hand);font-size:21px;color:var(--muted);margin:2px 0 12px}
.toc{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.toc button{display:block;text-align:left;border:1.5px solid var(--ink);border-radius:16px;background:var(--white);padding:0;overflow:hidden;box-shadow:var(--shadow)}
.toc .scene{margin:0;border:0;border-radius:0;box-shadow:none}
.toc .scene figcaption{display:none}
.toc .scene .faces .av{--fs:58px}
.toc .ti{padding:8px 12px 10px}
.toc .ti b{display:block;font-family:var(--hand);font-weight:400;font-size:22px;line-height:1.1}
.toc .ti small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.toc .done{float:right;font-size:12px;background:var(--mint);border:1px solid var(--ink);border-radius:10px;padding:1px 7px;margin-top:3px}
.chap h3{font-family:var(--brush);font-weight:400;font-size:40px;margin:0;line-height:1.1}
.chap .no{font-family:var(--hand);font-size:22px;color:#7A6443}
.chap .sub{font-family:var(--hand);font-size:21px;color:var(--muted);margin:2px 0 0}
.chap p.tx{font-size:17.5px;line-height:1.95;margin:12px 0;word-break:keep-all}
.chap .sl{border:0;background:none;padding:0;font:inherit;color:inherit;text-decoration:underline;text-decoration-style:dotted;text-decoration-color:var(--wood);text-underline-offset:3px;cursor:pointer}
.who{display:flex;align-items:center;gap:12px;width:100%;margin:14px 0 4px;border:1.5px solid var(--ink);border-radius:40px 16px 16px 40px;background:var(--paper);padding:5px 14px 5px 5px;text-align:left}
.who .av{width:58px;height:58px;flex-shrink:0}
.who b{display:block;font-family:var(--hand);font-weight:400;font-size:22px;line-height:1.1}
.who small{display:block;color:var(--muted);font-size:13px}
.who .go{margin-left:auto;font-size:12px;color:var(--navy);white-space:nowrap}
.chap .scene{max-width:640px;margin-left:auto;margin-right:auto}
.chend{margin:26px 0 0;padding:16px;border:1.5px dashed var(--wood);border-radius:18px;background:var(--gold);text-align:center}
.chend p{font-family:var(--hand);font-size:22px;margin:0 0 10px}
.chend .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* 퀴즈 */
.qz-sec{margin:0 0 22px}
.qz-sec h3{font-family:var(--hand);font-weight:400;font-size:26px;margin:0 0 8px;color:var(--navy)}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lv button{border:1.5px solid var(--ink);border-radius:16px;padding:14px 8px;background:var(--white);box-shadow:var(--shadow);text-align:center}
.lv button b{display:block;font-family:var(--hand);font-weight:400;font-size:26px}
.lv button small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}
.lv button:nth-child(1){background:var(--mint)}.lv button:nth-child(2){background:var(--blue)}.lv button:nth-child(3){background:var(--lav)}
.chq{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chq button{border:1.5px solid var(--ink);border-radius:14px;background:var(--white);padding:8px 10px;text-align:left;font-size:14px;line-height:1.3}
.chq button small{display:block;color:var(--muted);font-size:12px}
.hof{border:1.5px solid var(--ink);border-radius:16px;background:var(--white);overflow:hidden}
.hof .tabs{display:flex;overflow-x:auto;border-bottom:1.5px solid var(--line);background:var(--paper)}
.hof .tabs button{border:0;background:none;padding:9px 12px;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent}
.hof .tabs button.on{border-bottom-color:var(--navy);font-weight:700}
.hof ol{list-style:none;margin:0;padding:6px 0}
.hof li{display:flex;align-items:center;gap:10px;padding:7px 14px;font-size:15px}
.hof li .rk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--ink);font-size:13px;background:var(--cream);flex-shrink:0}
.hof li:nth-child(1) .rk{background:var(--gold)}.hof li:nth-child(2) .rk{background:var(--gray)}.hof li:nth-child(3) .rk{background:var(--salmon)}
.hof li .nm{flex:1;font-family:var(--hand);font-size:21px}
.hof li .sc{font-weight:700}
.hof li .dt{color:var(--muted);font-size:12px}
.hof li.me{background:var(--mint)}
.hof .empty{padding:18px;text-align:center;color:var(--muted)}
.qp .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.qp .dots{display:flex;gap:5px;flex:1;flex-wrap:wrap}
.qp .dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink);background:var(--white)}
.qp .dots i.ok{background:var(--mint-d)}.qp .dots i.no{background:var(--salmon-d)}.qp .dots i.cur{background:var(--gold)}
.qp .score{font-family:var(--hand);font-size:24px;white-space:nowrap}
.qp .combo{font-size:12px;background:var(--salmon);border:1px solid var(--ink);border-radius:10px;padding:1px 8px}
.qp .qimg{width:min(220px,60vw);aspect-ratio:1;margin:6px auto 10px;border-radius:50%;overflow:hidden;border:2px solid var(--ink);box-shadow:var(--shadow)}
.qp .qimg .av{width:100%;height:100%}
.qp .qimg .av .ini{font-size:90px!important}
.qp .scene{margin:4px 0 12px}
.qp .scene figcaption{display:none}
.qp .q{font-size:20px;line-height:1.55;font-weight:700;margin:6px 0 14px;word-break:keep-all}
.qp .opts{display:grid;gap:9px}
.qp .opts button{display:flex;align-items:center;gap:10px;border:1.5px solid var(--ink);border-radius:16px;background:var(--white);padding:10px 14px;font-size:17px;text-align:left;box-shadow:0 3px 0 rgba(58,55,57,.1);min-height:54px}
.qp .opts button .av{width:40px;height:40px;flex-shrink:0}
.qp .opts button .n{width:26px;height:26px;border-radius:50%;border:1px solid var(--ink);display:grid;place-items:center;font-size:13px;flex-shrink:0;background:var(--cream)}
.qp .opts button.ok{background:var(--mint);border-width:2.5px}
.qp .opts button.no{background:var(--salmon)}
.qp .opts button:disabled{cursor:default;color:var(--ink)}
.qp .fb{margin-top:14px;border:1.5px dashed var(--wood);border-radius:16px;padding:12px 14px;background:var(--gold);font-size:15.5px;line-height:1.7;word-break:keep-all}
.qp .fb.no{background:var(--lav)}
.qp .fb b{display:block;font-family:var(--hand);font-weight:400;font-size:26px;color:var(--navy)}
.qp .fb .sl{border:0;background:none;padding:0;font:inherit;color:inherit;text-decoration:underline;text-decoration-style:dotted;text-decoration-color:var(--navy);text-underline-offset:3px;cursor:pointer}
.qp .next{margin-top:14px;width:100%}
.qr{text-align:center}
.qr .big{font-family:var(--brush);font-size:72px;line-height:1;margin:10px 0 0;color:var(--navy)}
.qr .msg{font-family:var(--hand);font-size:26px;margin:4px 0 14px}
.qr .stamp{width:min(200px,50vw);aspect-ratio:1;margin:0 auto;border-radius:50%;overflow:hidden;border:2px solid var(--ink)}
.qr .stamp .av{width:100%;height:100%}
.qr form{display:flex;gap:8px;justify-content:center;margin:16px 0}
.qr input{height:46px;border-radius:23px;border:1.5px solid var(--ink);background:var(--white);padding:0 16px;font:inherit;font-size:17px;width:min(220px,55vw);outline:none}
.qr .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0 18px}
.qr .wrong{text-align:left;margin-top:16px}
.qr .wrong h4{font-family:var(--hand);font-weight:400;font-size:22px;margin:0 0 6px}
.qr .wrong div{border:1px solid var(--line);border-radius:12px;background:var(--white);padding:8px 12px;margin:0 0 6px;font-size:14.5px;line-height:1.55}
.welcome .modes{display:flex;gap:10px;justify-content:center;margin:0 0 16px;flex-wrap:wrap}
.welcome .modes .pillbtn{font-size:17px;padding:11px 20px}
@media (max-width:900px){
  .ov .obar h2{font-size:24px}
  .chap h3{font-size:32px}
  .chap p.tx{font-size:17px}
  .toc{grid-template-columns:repeat(2,1fr);gap:10px}
  .toc .ti b{font-size:19px}
  .scene .faces .av{--fs:74px}
  .lv button b{font-size:22px}
  .brand h1{font-size:21px}
}
@media (max-width:520px){
  header .ibtn{padding:0;width:44px;min-width:44px;height:44px}
  header{gap:6px}
  .brand h1{font-size:19px}
  .backpill{top:196px;left:12px;transform:none;padding:8px 14px;font-size:14px}
}
@media (max-width:900px){ .brand{min-width:0;flex:1} .brand>span:last-child{min-width:0} .brand h1{overflow:hidden;text-overflow:ellipsis} .hbtns{flex-shrink:0;margin-left:auto} }
@media (max-width:420px){ .brand h1{font-size:17px} .brand .logo{width:30px;height:30px} }

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
(function(){
'use strict';
const D = window.MYTH;
const ST = window.STORIES || {};
const P = {}; D.people.forEach(p => P[p.id] = p);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 색·라벨 ---------- */
const CAT_COLOR = {pri:'#DCCFE5',tit:'#C7B890',oly:'#F0DEAA',god:'#BDCFE0',nym:'#C7E1D7',her:'#F1C7A4',mor:'#EDE7D6',mon:'#B6B1C4',grp:'#C8CCD6',art:'#EFCB6E'};
// 관계 그룹: 표시 순서 = 원 위 배치 순서(12시부터 시계방향)
const GROUPS = [
  {k:'parent', ko:'부모', color:'#6F8FB0'},
  {k:'spouse', ko:'배우자', color:'#E08F55'},
  {k:'lover',  ko:'연인', color:'#A58FC4'},
  {k:'sib',    ko:'형제자매', color:'#A89660'},
  {k:'child',  ko:'자녀', color:'#6FA38D'},
  {k:'member', ko:'소속·구성원', color:'#C9A94E'},
  {k:'bond',   ko:'인연', color:'#8F96A8'},
  {k:'item',   ko:'보물·신물', color:'#C08A1E'},
  {k:'holder', ko:'관련 인물', color:'#8C7A5B'},
  {k:'rival',  ko:'대립', color:'#B8876A'},
  {k:'kill',   ko:'죽임', color:'#2E3A57'},
];
const GC = {}; GROUPS.forEach(g => GC[g.k] = g);

/* ---------- 에셋 로딩 (없으면 대체 표시) ---------- */
const imgCache = new Map(); // url -> Promise<bool>
function probe(url){
  if(!imgCache.has(url)) imgCache.set(url, new Promise(r => { const i = new Image(); i.onload = () => r(true); i.onerror = () => r(false); i.src = url; }));
  return imgCache.get(url);
}
const PORTRAIT_EXT = ['png'];
const portraitUrl = new Map(); // id -> url|null|Promise
function findPortrait(id){
  if(portraitUrl.has(id)) return portraitUrl.get(id);
  const pr = (async () => { for(const e of PORTRAIT_EXT){ const u = `images/portraits/${id}.${e}`; if(await probe(u)) return u; } return null; })();
  portraitUrl.set(id, pr);
  pr.then(u => portraitUrl.set(id, u));
  return pr;
}
function wireAssets(root){
  root.querySelectorAll('img[data-asset]').forEach(img => {
    const fb = img.parentElement.querySelector('[data-fb]');
    img.style.display = 'none';
    probe(img.dataset.asset).then(ok => { if(ok){ img.src = img.dataset.asset; img.style.display = ''; if(fb) fb.style.display = 'none'; } });
  });
}
let FRAME_OK = false, catIcon = {}, FRAME_SRC = 'images/ui/frame.png';
// 관계도용 작은 그림: 큰 초상(512px)을 그대로 수십 장 그리면 휴대폰 그래픽 메모리가 모자라 화면 일부가 비는 문제가 있어
// 한 번 줄인 그림을 만들어 두고 관계도 둘레 인물에 씀
const thumbs = new Map();
function thumbOf(url, size){
  const key = url + '@' + size;
  if(!thumbs.has(key)) thumbs.set(key, (async () => {
    try{
      const i = new Image(); i.src = url; await i.decode();
      const c = document.createElement('canvas'); c.width = c.height = size;
      const x = c.getContext('2d'); x.imageSmoothingQuality = 'high';
      const s = Math.min(i.naturalWidth, i.naturalHeight);
      x.drawImage(i, (i.naturalWidth - s) / 2, (i.naturalHeight - s) / 2, s, s, 0, 0, size, size);
      const b = await new Promise(res => c.toBlob(res, 'image/png'));
      return b ? URL.createObjectURL(b) : url;
    }catch(e){ return url; }
  })());
  return thumbs.get(key);
}
probe('images/ui/frame.png').then(ok => { FRAME_OK = ok; if(ok){ thumbOf('images/ui/frame.png', 256).then(u => { FRAME_SRC = u; document.querySelectorAll('#graph .node:not(.center) image[href="images/ui/frame.png"]').forEach(el => el.setAttribute('href', u)); }); if(state.cur) render(state.cur, false); } });
Object.keys(CAT_COLOR).forEach(c => probe(`images/icons/cat-${c}.png`).then(ok => { if(ok) catIcon[c] = `images/icons/cat-${c}.png`; }));

function initialOf(p){ return p.ko.replace(/\(.*\)/,'').trim().charAt(0); }
// HTML 아바타
function avatar(p, size){
  const el = document.createElement('span');
  el.className = 'av';
  el.style.background = CAT_COLOR[p.cat];
  el.innerHTML = `<span class="ini" style="font-size:${Math.round(size*0.62)}px">${esc(initialOf(p))}</span>`;
  const u = portraitUrl.get(p.id);
  const put = url => { if(!url) return; el.innerHTML = `<img alt="" width="${size}" height="${size}" decoding="async" src="${url}">`; };
  if(typeof u === 'string') put(u); else findPortrait(p.id).then(put);
  return el;
}
function avHTML(p, size){ return `<span class="av" data-av="${p.id}" data-size="${size}" style="background:${CAT_COLOR[p.cat]}"><span class="ini" style="font-size:${Math.round(size*0.62)}px">${esc(initialOf(p))}</span></span>`; }
function hydrateAv(root){
  root.querySelectorAll('[data-av]').forEach(el => {
    const id = el.dataset.av; el.removeAttribute('data-av');
    const u = portraitUrl.get(id);
    const sz = el.dataset.size || 64; const put = url => { if(url) el.innerHTML = `<img alt="" width="${sz}" height="${sz}" decoding="async" src="${url}">`; };
    if(typeof u === 'string') put(u); else if(u !== null) findPortrait(id).then(put);
  });
}

/* ---------- 한글 검색 ---------- */
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const JUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ';
const JONG = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function jamo(s){
  let o = '';
  for(const ch of s){
    const c = ch.charCodeAt(0);
    if(c >= 0xAC00 && c <= 0xD7A3){ const i = c - 0xAC00; o += CHO[Math.floor(i/588)] + JUNG[Math.floor((i%588)/28)] + JONG[i%28]; }
    else o += ch;
  }
  return o;
}
function chosung(s){
  let o = '';
  for(const ch of s){ const c = ch.charCodeAt(0); o += (c >= 0xAC00 && c <= 0xD7A3) ? CHO[Math.floor((c-0xAC00)/588)] : ch; }
  return o;
}
const norm = s => String(s).toLowerCase().replace(/[\s·()\-_,.'"「」『』]/g,'');
const isCho = s => /^[ㄱ-ㅎ]+$/.test(s);
const hasHangul = s => /[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(s);

// 검색 색인
const INDEX = D.people.map(p => {
  const keys = [];
  const add = (t, kind) => { const n = norm(t); if(n && !keys.some(k => k.n === n)) keys.push({t, kind, n, j:jamo(n), c:chosung(n)}); };
  add(p.ko, 'name');
  add(p.ko.replace(/\(.*?\)/g,''), 'name');
  p.al.forEach(a => add(a, 'alias'));
  add(p.en, 'en'); add(p.id.replace(/_/g,' '), 'en');
  p.ro.split(',').forEach(r => add(r, 'en'));
  return {p, keys};
});
// 부분 문자열 편집거리(Sellers): 대상 안 어느 위치든 q와 가장 가까운 구간의 거리
function subDist(q, t){
  const m = q.length, n = t.length;
  let prev = new Array(n+1).fill(0), cur = new Array(n+1);
  for(let i = 1; i <= m; i++){
    cur[0] = i;
    for(let j = 1; j <= n; j++){
      const cost = q[i-1] === t[j-1] ? 0 : 1;
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+cost);
    }
    [prev, cur] = [cur, prev];
  }
  let best = Infinity; for(let j = 0; j <= n; j++) best = Math.min(best, prev[j]);
  return best;
}
function lev(a, b){
  const m = a.length, n = b.length; if(!m) return n; if(!n) return m;
  let prev = Array.from({length:n+1}, (_, j) => j), cur = new Array(n+1);
  for(let i = 1; i <= m; i++){
    cur[0] = i;
    for(let j = 1; j <= n; j++) cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    [prev, cur] = [cur, prev];
  }
  return prev[n];
}
function search(raw, limit = 8){
  const q = norm(raw);
  if(!q) return [];
  const qj = jamo(q), cho = isCho(q), kor = hasHangul(q);
  const out = [];
  for(const {p, keys} of INDEX){
    let best = null;
    for(const k of keys){
      let s = 0, why = '';
      if(k.n === q) s = 100;
      else if(k.n.startsWith(q)) s = 92 - Math.min(10, k.n.length - q.length);
      else if(k.n.includes(q)) s = 78 - Math.min(8, k.n.indexOf(q));
      else if(cho && k.c.startsWith(q)) { s = 86 - Math.min(8, k.c.length - q.length); why = '초성'; }
      else if(cho && k.c.includes(q)) { s = 70; why = '초성'; }
      else if(kor && !cho && k.j.startsWith(qj)) s = 88;
      else if(kor && !cho && k.j.includes(qj)) s = 72;
      else if(!cho){
        // 오타 허용: 한글은 자모 단위, 영문은 글자 단위
        const a = kor ? qj : q, b = kor ? k.j : k.n;
        if(a.length >= 3){
          const allow = a.length >= 12 ? 3 : a.length >= 7 ? 2 : 1;
          const whole = lev(a, b);
          const part = a.length >= 5 ? subDist(a, b) : Infinity;
          const d = Math.min(whole, part + 0.5);
          if(d <= allow) { s = 64 - d*8 - (whole > d ? 4 : 0); why = '비슷한 이름'; }
        }
      }
      if(s){
        if(k.kind === 'alias' && !why) why = '별칭 ' + k.t;
        else if(k.kind === 'alias') why += ' · ' + k.t;
        if(k.kind === 'en' && !why) why = k.t;
        if(k.kind !== 'name') s -= 2;
        if(!best || s > best.s) best = {p, s, why, key:k};
      }
    }
    if(best) out.push(best);
  }
  out.sort((a, b) => b.s - a.s || degree(b.p.id) - degree(a.p.id) || a.p.ko.length - b.p.ko.length);
  return out.slice(0, limit);
}
function highlight(name, q){
  const n = norm(q); if(!n) return esc(name);
  const i = name.toLowerCase().indexOf(n);
  if(i >= 0) return esc(name.slice(0, i)) + '<mark>' + esc(name.slice(i, i + n.length)) + '</mark>' + esc(name.slice(i + n.length));
  if(isCho(n)){ // 초성 하이라이트
    const c = chosung(name); const k = c.indexOf(n);
    if(k >= 0) return esc(name.slice(0, k)) + '<mark>' + esc(name.slice(k, k + n.length)) + '</mark>' + esc(name.slice(k + n.length));
  }
  return esc(name);
}

/* ---------- 관계 ---------- */
const ADJ = {}; D.people.forEach(p => ADJ[p.id] = []);
D.edges.forEach(e => { ADJ[e.a].push(e); ADJ[e.b].push(e); });
const deg = {}; D.people.forEach(p => deg[p.id] = ADJ[p.id].length);
const degree = id => deg[id] || 0;
const parentsOf = (id, withV) => ADJ[id].filter(e => e.t === 'P' && e.b === id && (withV || !e.v)).map(e => e.a);
const childrenOf = (id, withV) => ADJ[id].filter(e => e.t === 'P' && e.a === id && (withV || !e.v)).map(e => e.b);

// 중심 인물 기준 이웃 목록: id -> {groups:Set, tags:[{g,label,note,v}]}
function neighbors(id, withV){
  const map = new Map();
  const put = (oid, g, label, note, v) => {
    if(oid === id) return;
    if(!map.has(oid)) map.set(oid, {id:oid, tags:[]});
    const n = map.get(oid);
    if(n.tags.some(t => t.g === g && t.label === label)) return;
    n.tags.push({g, label, note:note || '', v:!!v});
  };
  for(const e of ADJ[id]){
    if(e.v && !withV) continue;
    const me = e.a === id, o = me ? e.b : e.a;
    switch(e.t){
      case 'P': put(o, me ? 'child' : 'parent', me ? '자녀' : '부모', e.n, e.v); break;
      case 'S': put(o, 'spouse', '배우자', e.n, e.v); break;
      case 'L': put(o, 'lover', '연인', e.n, e.v); break;
      case 'K': put(o, 'kill', me ? '처치함' : '죽인 자', e.n, e.v); break;
      case 'F': put(o, 'rival', '대립', e.n, e.v); break;
      case 'O': put(o, 'bond', me ? (e.il || '인연') : (e.l || '인연'), e.n, e.v); break;
      case 'M': put(o, 'member', me ? '구성원' : '소속', e.n, e.v); break;
      case 'T': put(o, me ? 'holder' : 'item', me ? (e.il || '관련 인물') : (e.l || '관련 물건'), e.n, e.v); break;
    }
  }
  // 형제자매 (부모 공유)
  const myPar = parentsOf(id, withV);
  if(myPar.length){
    const sibs = new Map();
    myPar.forEach(par => childrenOf(par, withV).forEach(s => { if(s !== id){ sibs.set(s, (sibs.get(s) || 0) + 1); } }));
    sibs.forEach((cnt, s) => {
      const sp = parentsOf(s, withV);
      const full = cnt >= Math.min(myPar.length, sp.length) && myPar.length === sp.length;
      put(s, 'sib', full ? '형제자매' : '이복·이부', '', false);
    });
  }
  const order = GROUPS.map(g => g.k);
  for(const n of map.values()){
    // 주 그룹: 혈연/혼인을 우선
    n.tags.sort((a, b) => order.indexOf(a.g) - order.indexOf(b.g));
    const pri = ['parent','child','spouse','lover','kill','sib','member','rival','bond','holder','item'];
    n.main = n.tags.slice().sort((a, b) => pri.indexOf(a.g) - pri.indexOf(b.g))[0].g;
    n.allV = n.tags.every(t => t.v);
  }
  return map;
}

/* ---------- 상태 ---------- */
const state = {cur:null, withV:false, off:new Set(), trail:[], view:{x:0,y:0,k:1}, expanded:new Set()};
try { state.withV = localStorage.getItem('myth.v') === '1'; } catch(e){}

/* ---------- 그래프 렌더 ---------- */
const svg = $('#graph');
const NS = 'http://www.w3.org/2000/svg';
const mk = (tag, attrs, parent) => { const el = document.createElementNS(NS, tag); for(const k in attrs) el.setAttribute(k, attrs[k]); if(parent) parent.appendChild(el); return el; };
let world, bounds = {w:800, h:600};
const SIB_LIMIT = 12;

function layout(center, nb){
  // 그룹별로 모으기
  const byG = {}; GROUPS.forEach(g => byG[g.k] = []);
  for(const n of nb.values()) if(!state.off.has(n.main)) byG[n.main].push(n);
  for(const k in byG) byG[k].sort((a, b) => degree(b.id) - degree(a.id) || P[a.id].ko.localeCompare(P[b.id].ko, 'ko'));
  // 형제가 많으면 접기
  if(byG.sib.length > SIB_LIMIT && !state.expanded.has('sib')){
    const full = byG.sib.filter(n => n.tags.some(t => t.label === '형제자매'));
    const half = byG.sib.filter(n => !full.includes(n));
    const keep = full.concat(half).slice(0, SIB_LIMIT - 1);
    const rest = byG.sib.length - keep.length;
    byG.sib = keep.concat([{id:'__more_sib', more:rest, main:'sib', tags:[{g:'sib', label:`+${rest}명`}]}]);
  }
  const active = GROUPS.filter(g => byG[g.k].length);
  const total = active.reduce((s, g) => s + byG[g.k].length, 0);
  const nodes = [];
  if(!total) return {nodes, sectors:[]};
  const GAP = active.length > 1 ? 0.10 : 0; // 섹터 사이 간격(rad)
  const avail = Math.PI*2 - GAP*active.length;
  const SP = 108; // 노드 간 최소 호 길이
  const R0 = Math.max(200, Math.min(300, (total + active.length) * SP / (Math.PI*2)));
  // 섹터 각도: 한 바퀴에 다 들어가면 필요한 만큼 + 여유 분배, 아니면 개수 비례
  const need = active.map(g => Math.max(byG[g.k].length, 1) * SP / R0);
  const needSum = need.reduce((a, b) => a + b, 0);
  let w;
  if(needSum <= avail) w = need.map(n => n + (avail - needSum) / active.length);
  else {
    w = active.map(g => Math.max(byG[g.k].length, 2.2));
  }
  const ws = w.reduce((a, b) => a + b, 0);
  let ang = -Math.PI/2 - (avail * w[0] / ws)/2 - GAP/2; // 첫 그룹(부모)이 12시에 오도록
  const sectors = [];
  active.forEach((g, gi) => {
    const span = avail * w[gi] / ws;
    const a0 = ang + GAP/2, a1 = a0 + span;
    const items = byG[g.k];
    // 링별 수용량으로 채우기
    let ring = 0, placed = 0;
    while(placed < items.length){
      const r = R0 + ring * 128;
      const cap = Math.max(1, Math.floor(span * r / SP + 0.25));
      const cnt = Math.min(cap, items.length - placed);
      for(let i = 0; i < cnt; i++){
        const t = cnt === 1 ? 0.5 : (i + 0.5) / cnt;
        const a = a0 + span * t;
        nodes.push({n:items[placed + i], x:Math.cos(a)*r, y:Math.sin(a)*r, g:g.k, a, r});
      }
      placed += cnt; ring++;
    }
    sectors.push({g, a:(a0 + a1)/2, r:R0 * 0.58, n:items.length});
    ang = a1 + GAP/2;
  });
  return {nodes, sectors};
}

function nodeEl(parent, p, x, y, r, opts){
  const g = mk('g', {class:'node' + (opts.center ? ' center' : '') + (opts.more ? ' more' : ''), transform:`translate(${x},${y})`, tabindex:0, role:'button', 'aria-label':opts.aria || p?.ko || ''}, parent);
  const inner = mk('g', {class:'pop', style:`animation-delay:${opts.delay || 0}ms;transform-origin:0 0`}, g);
  mk('circle', {class:'hit', r:r + 6, 'data-r':r + 6}, inner);
  if(opts.more){
    mk('circle', {r, class:'ring'}, inner);
    const t = mk('text', {'text-anchor':'middle', dy:'0.35em', class:'nm', style:'font-size:15px'}, inner); t.textContent = opts.label;
    return g;
  }
  mk('circle', {r:r + 3, fill:CAT_COLOR[p.cat], stroke:'none'}, inner);
  mk('circle', {r, class:'ring', fill:CAT_COLOR[p.cat]}, inner);
  const ini = mk('text', {'text-anchor':'middle', dy:'0.36em', style:`font-family:var(--hand);font-size:${Math.round(r*1.15)}px`, fill:'#3A3739'}, inner);
  ini.textContent = initialOf(p);
  const img = mk('image', {x:-r, y:-r, width:r*2, height:r*2, 'clip-path':'url(#cc)', preserveAspectRatio:'xMidYMid slice', style:'display:none'}, inner);
  const apply = u => { img.setAttribute('href', u); img.style.display = ''; ini.style.display = 'none'; };
  const setImg = u => { if(!u) return; if(opts.center) apply(u); else thumbOf(u, 192).then(apply); };
  const cached = portraitUrl.get(p.id);
  if(typeof cached === 'string') setImg(cached); else if(cached !== null) findPortrait(p.id).then(setImg);
  mk('circle', {r, fill:'none', stroke:'#3A3739', 'stroke-width':opts.center ? 2.4 : 1.6}, inner);
  if(FRAME_OK) mk('image', {href:opts.center ? 'images/ui/frame.png' : FRAME_SRC, x:-r*1.28, y:-r*1.28, width:r*2.56, height:r*2.56, style:'pointer-events:none'}, inner);
  if(catIcon[p.cat] && !opts.center) mk('image', {href:catIcon[p.cat], x:r*0.45, y:-r*1.05, width:r*0.7, height:r*0.7}, inner);
  const nm = mk('text', {'text-anchor':'middle', y:r + (opts.center ? 26 : 18), class:'nm'}, inner);
  nm.textContent = p.ko;
  if(opts.tags){
    const tg = mk('text', {'text-anchor':'middle', y:r + 33, class:'tag'}, inner);
    opts.tags.slice(0, 2).forEach((t, i) => {
      const s = mk('tspan', {fill:GC[t.g].color, 'font-weight':t.g === 'kill' ? 700 : 400}, tg);
      s.textContent = (i ? ' · ' : '') + t.label + (t.v ? '*' : '');
    });
    if(opts.tags.length > 2){ const s = mk('tspan', {fill:'#6E6863'}, tg); s.textContent = ` +${opts.tags.length - 2}`; }
  }
  return g;
}

function render(id, fresh = true){
  const p = P[id]; if(!p) return;
  state.cur = id;
  $('#welcome').style.display = 'none';
  const nb = neighbors(id, state.withV);
  const {nodes, sectors} = layout(id, nb);
  svg.innerHTML = '';
  const defs = mk('defs', {}, svg);
  const cp = mk('clipPath', {id:'cc', clipPathUnits:'objectBoundingBox'}, defs); mk('circle', {cx:.5, cy:.5, r:.5}, cp);
  world = mk('g', {}, svg);
  const eg = mk('g', {}, world), sg = mk('g', {}, world), ng = mk('g', {}, world);
  // 섹터 라벨
  sectors.forEach(s => {
    const t = mk('text', {x:Math.cos(s.a)*s.r, y:Math.sin(s.a)*s.r, 'text-anchor':'middle', dy:'0.35em', class:'sector-label', fill:s.g.color}, sg);
    t.textContent = s.g.ko;
  });
  // 간선 + 노드
  nodes.forEach((o, i) => {
    const col = GC[o.g].color;
    const mx = o.x * 0.5 + Math.cos(o.a + Math.PI/2) * 18, my = o.y * 0.5 + Math.sin(o.a + Math.PI/2) * 18;
    const path = mk('path', {d:`M0,0 Q${mx},${my} ${o.x},${o.y}`, class:'edge' + (o.n.allV ? ' v' : ''), stroke:col, 'data-id':o.n.id, style:`animation-delay:${i*12}ms`}, eg);
    if(o.n.more){
      const el = nodeEl(ng, null, o.x, o.y, 28, {more:true, label:`+${o.n.more}`, aria:`이복형제 ${o.n.more}명 더 보기`, delay:i*12});
      el.addEventListener('click', () => { state.expanded.add('sib'); render(id, false); });
      onKey(el, () => { state.expanded.add('sib'); render(id, false); });
      return;
    }
    const q = P[o.n.id];
    const el = nodeEl(ng, q, o.x, o.y, 28, {tags:o.n.tags, delay:i*12});
    el.addEventListener('click', ev => { if(dragMoved) return; go(q.id); });
    onKey(el, () => go(q.id));
    el.addEventListener('pointerenter', ev => { path.classList.add('hl'); showTip(ev, q, o.n.tags); });
    el.addEventListener('pointermove', ev => moveTip(ev));
    el.addEventListener('pointerleave', () => { path.classList.remove('hl'); hideTip(); });

}
function zoomAt(f, cx, cy){
  const v = state.view; const k = Math.max(0.2, Math.min(3, v.k * f));

}

(function(){

    const dx = e.clientX - last.x, dy = e.clientY - last.y;

})();

(function(){
  let drag = null;
  const MIN = 92;
  const maxH = () => $('#main').clientHeight - 12;
  panel.addEventListener('pointerdown', e => {
    if(!e.target.closest('.grab') || innerWidth > 900) return;
    e.preventDefault();
    drag = {y:e.clientY, h:panel.getBoundingClientRect().height, moved:false, id:e.pointerId};
    try{ panel.setPointerCapture(e.pointerId); }catch(_){}
    panel.style.transition = 'none';
  });
  panel.addEventListener('pointermove', e => {
    if(!drag || e.pointerId !== drag.id) return;
    const dy = drag.y - e.clientY;
    if(Math.abs(dy) > 4) drag.moved = true;
    if(!drag.moved) return;
    const h = Math.max(MIN, Math.min(maxH(), drag.h + dy));
    panel.classList.remove('min', 'max');
    panel.style.height = h + 'px';
    panel.classList.toggle('short', h < 140);
  });
  const end = e => {
    if(!drag || e.pointerId !== drag.id) return;
    panel.style.transition = '';
    if(!drag.moved){
      // 짧게 누르면: 기본 → 크게 → 작게 → 기본
      if(panel.classList.contains('short')) panel.classList.add('min');

      if(panel.classList.contains('min')) panel.classList.remove('min');

      else panel.classList.add('max');

const NAME_IDX = (() => {
  const m = new Map(), dup = new Set();
  const put = (n, id) => { if(n.length < 2) return; if(m.has(n) && m.get(n) !== id){ dup.add(n); return; } m.set(n, id); };
  D.people.forEach(p => put(p.ko, p.id));
  const bases = {};
  D.people.forEach(p => { const b = p.ko.replace(/\(.*?\)/g, '').trim(); if(b !== p.ko) (bases[b] = bases[b] || []).push(p.id); });
  Object.entries(bases).forEach(([b, list]) => { if(list.length === 1 && !m.has(b)) put(b, list[0]); else dup.add(b); });
  ['아테'].forEach(n => dup.add(n));
  dup.forEach(n => m.delete(n));
  const byFirst = {};
  [...m.keys()].sort((a, b) => b.length - a.length).forEach(n => (byFirst[n[0]] = byFirst[n[0]] || []).push(n));
  return {m, byFirst};
})();
const PARTICLE = '은는이가을를의와과도로에만께한처보부까조랑야요라며나였인지예죠들';
const isHan = c => c && /[가-힣]/.test(c);
function linkify(text, self, used){
  let out = '', i = 0;
  while(i < text.length){
    const c = text[i];
    let hit = null;
    if(!isHan(text[i - 1]) && NAME_IDX.byFirst[c]){
      for(const n of NAME_IDX.byFirst[c]){
        if(text.startsWith(n, i)){
          const nx = text[i + n.length];
          if(!isHan(nx) || PARTICLE.includes(nx)){ hit = n; }
          break;
        }
      }
    }
    if(hit){
      const id = NAME_IDX.m.get(hit);
      if(id !== self && !used.has(id)){ used.add(id); out += `<button class="sl" data-go="${id}">${esc(hit)}</button>`; }
      else out += esc(hit);
      i += hit.length;
    } else { out += esc(c); i++; }
  }
  return out;
}

  const st = ST[p.id];

  const namesUsed = new Set([a.ko]);
  const same = otherCat ? [] : shuffle(pool.filter(id => !badSet.has(id) && P[id].cat === a.cat));
  const other = shuffle(pool.filter(id => !badSet.has(id) && P[id].cat !== a.cat));
  const out = [];
  for(const id of [...same, ...other]){ if(out.length >= n) break; if(namesUsed.has(P[id].ko)) continue; namesUsed.add(P[id].ko); out.push(id); }
  return out;
}
function mkQ(lv, pool, usedIds){
  const types = lv === 'easy' ? ['face','face','sym','par','chi','dom'] : lv === 'normal' ? ['face','sym','par','chi','dom','spo','won'] : ['face','sym','par','chi','dom','spo','won','sib'];
  for(let tries = 0; tries < 60; tries++){
    const ty = pickOne(types);
    const id = pickOne(pool);
    if(usedIds.has(id)) continue;
    const p = P[id];
    let q, ans, bad = [], img = null, e, showFaces = true, subj = id;
    if(ty === 'face'){
      q = '이 초상화의 주인공은 누구일까요?'; ans = id; img = id; showFaces = false;
      e = withName(id);
    } else if(ty === 'sym'){
      if(!p.sym || !p.sym.length) continue;
      const s = pickOne(p.sym);
      bad = D.people.filter(x => (x.sym || []).includes(s)).map(x => x.id);
      if(bad.length > 2) continue;
      q = `「${s}」${hasJong(s) ? '이' : '가'} 상징인 인물은 누구일까요?`; ans = id;
      e = `${p.ko}의 상징은 ${p.sym.join(', ')}${hasJong(p.sym[p.sym.length - 1]) ? '이에요' : '예요'}. ${firstLine(id)}`;
    } else if(ty === 'dom'){
      if(!p.dom) continue;
      bad = D.people.filter(x => x.dom === p.dom).map(x => x.id);
      q = `「${p.dom}」, 누구일까요?`; ans = id;
      e = withName(id);
    } else {
      const list = REL[ty](id).filter(x => P[x] && P[x].cat !== 'grp' && P[x].cat !== 'art');
      const inPool = list.filter(x => pool.includes(x) || lv === 'hard');
      if(!inPool.length) continue;
      ans = pickOne(inPool); bad = list;
      const who = p.ko;
      if(ty === 'par') q = `${josa(who, '의', '의')} 부모 가운데 한 명은 누구일까요?`, e = `${who}의 부모: ${list.map(nm).join(', ')}.`;
      if(ty === 'chi') q = `${who}의 자녀는 누구일까요?`, e = `${who}의 자녀로는 ${list.slice(0, 6).map(nm).join(', ')}${list.length > 6 ? ' 등이' : (hasJong(nm(list[Math.min(list.length, 6) - 1])) ? '이' : '가')} 있어요.`;
      if(ty === 'spo') q = `${who}의 배우자는 누구일까요?`, e = `${who}의 배우자: ${list.map(nm).join(', ')}.`;
      if(ty === 'won') q = `${josa(who, '과', '와')} 싸워 이긴 인물은 누구일까요?`, e = `${josa(who, '을', '를')} 물리친 인물: ${list.map(nm).join(', ')}.`;
      if(ty === 'sib') q = `${who}의 형제자매는 누구일까요?`, e = `${who}의 형제자매로는 ${list.slice(0, 6).map(nm).join(', ')}${list.length > 6 ? ' 등이' : (hasJong(nm(list[Math.min(list.length, 6) - 1])) ? '이' : '가')} 있어요.`;
      e += ' ' + firstLine(ans);
    }
    const ds = distract(ans, pool.length > 20 ? pool : D.people.map(x => x.id), bad, 3, ty === 'dom');
    if(ds.length < 3) continue;
    usedIds.add(id); usedIds.add(ans);
    const opts = shuffle([ans, ...ds]);
    return {q, o:opts.map(nm), ids:opts, a:opts.indexOf(ans), e, img, faces:showFaces, subj};
  }
  return null;
}
function startQuiz(cfg){
  track(cfg.kind === 'ch' ? '/퀴즈/장퀴즈/' + cfg.n + '장' : '/퀴즈/자유/' + LEVELS[cfg.lv].t, '퀴즈');
  let qs;
  if(cfg.kind === 'ch'){
    const ch = BOOK[cfg.n - 1];
    const idx = new Map(D.people.map(p => [p.ko, p.id]));
    const sc = shuffle(ch.b.filter(b => b.k === 'img').map(b => b.i));
    qs = shuffle(ch.q.map(x => ({...x}))).map((x, k) => {
      const ids = x.o.map(o => idx.get(o) || null);
      const order = shuffle([0, 1, 2, 3]);
      return {q:x.q, o:order.map(i => x.o[i]), ids:order.map(i => ids[i]), a:order.indexOf(x.a), e:x.e, scene:sc[k % sc.length], faces:true};
    });
    quiz = {mode:'ch' + cfg.n, cfg, qs, i:0, score:0, combo:0, res:[], mul:1, per:20};
  } else {
    const pool = poolFor(cfg.lv); const used = new Set(); qs = [];
    while(qs.length < 10){ const q = mkQ(cfg.lv, pool, used); if(!q) break; qs.push(q); }
    quiz = {mode:'free-' + cfg.lv, cfg, qs, i:0, score:0, combo:0, res:[], mul:LEVELS[cfg.lv].mul, per:10};
  }
  ovBook.classList.remove('on'); ovQuiz.classList.add('on'); setHash('quiz'); hideBackPill(); Sound.scene('quiz');
  drawQ();
}
const PRAISE = ['정답이에요!', '딩동댕!', '대단해요!', '척척박사네요!', '완벽해요!', '신들도 깜짝 놀라겠어요!'];
const OOPS = ['아쉬워요!', '괜찮아요, 다음엔 맞힐 거예요!', '앗, 헷갈렸죠?', '다음 문제는 꼭 맞혀 봐요!'];
function drawQ(){
  const z = quiz, x = z.qs[z.i];
  $('#quizTitle').textContent = MODE_NAME(z.mode);
  const w = document.createElement('div'); w.className = 'wrap qp';
  w.innerHTML = `<div class="top"><div class="dots">${z.qs.map((_, k) => `<i class="${k < z.i ? (z.res[k] ? 'ok' : 'no') : k === z.i ? 'cur' : ''}"></i>`).join('')}</div>${z.combo >= 2 ? `<span class="combo">${z.combo}연속!</span>` : ''}<span class="score">${z.score}점</span></div>`;
  if(x.img){ const d = document.createElement('div'); d.className = 'qimg'; d.innerHTML = avHTML(P[x.img], 220); w.appendChild(d); }
  else if(x.scene != null) w.appendChild(sceneFigure(BOOK[z.cfg.n - 1], x.scene, {max:4}));
  const q = document.createElement('div'); q.className = 'q'; q.textContent = `${z.i + 1}. ${x.q}`; w.appendChild(q);
  const ops = document.createElement('div'); ops.className = 'opts';
  ops.innerHTML = x.o.map((o, k) => `<button data-k="${k}">${x.faces && x.ids[k] && P[x.ids[k]] ? avHTML(P[x.ids[k]], 40) : `<span class="n">${k + 1}</span>`}<span>${esc(o)}</span></button>`).join('');
  w.appendChild(ops);
  if(x.picked != null) showFb(w, x);
  quizBody.innerHTML = ''; quizBody.appendChild(w);
  hydrateAv(w);
  if(x.picked == null) ops.querySelectorAll('button').forEach(b => b.onclick = () => answer(+b.dataset.k));
  else ops.querySelectorAll('button').forEach(b => b.disabled = true);
  quizBody.scrollTop = 0;
}
function answer(k){
  const z = quiz, x = z.qs[z.i];
  if(x.picked != null) return;
  x.picked = k;
  const ok = k === x.a;
  z.res[z.i] = ok;
  if(ok){ z.combo++; z.score += z.per * z.mul + (z.combo >= 3 ? 5 * z.mul : 0); } else z.combo = 0;
  x.msg = ok ? pickOne(PRAISE) : pickOne(OOPS);
  if(ok) Sound.sfx.ok(); else Sound.sfx.no();
  const st = quizBody.scrollTop; drawQ(); quizBody.scrollTop = st;
  const fb = quizBody.querySelector('.fb'); if(fb) fb.scrollIntoView({behavior:'smooth', block:'nearest'});
}
function showFb(w, x){
  const ok = x.picked === x.a;
  w.querySelectorAll('.opts button').forEach((b, k) => { if(k === x.a) b.classList.add('ok'); else if(k === x.picked) b.classList.add('no'); });
  const fb = document.createElement('div'); fb.className = 'fb' + (ok ? '' : ' no'); fb.setAttribute('role', 'status'); fb.setAttribute('aria-live', 'polite');
  fb.innerHTML = `<b>${esc(x.msg)}</b>${ok ? '' : `정답은 「${esc(x.o[x.a])}」예요. `}${linkBook(x.e, new Set())}`;
  w.appendChild(fb);
  const nx = document.createElement('button'); nx.className = 'pillbtn navy next';
  const last = quiz.i === quiz.qs.length - 1;
  nx.textContent = last ? '결과 보기' : '다음 문제';
  nx.onclick = () => { if(last) finish(); else { quiz.i++; drawQ(); } };
  w.appendChild(nx);
  wireLinks(fb, 'quiz');
}
function finish(){
  const z = quiz; z.over = true; Sound.sfx.fanfare();
  const right = z.res.filter(Boolean).length, n = z.qs.length;
  const msg = right === n ? '만점! 신화 박사 인정!' : right >= n * 0.8 ? '아주 잘했어요!' : right >= n * 0.5 ? '좋아요, 조금만 더!' : '이야기책을 한 번 더 읽어 볼까요?';
  const star = z.mode.startsWith('ch') ? (BOOK[z.cfg.n - 1].b.find(b => b.k === 'who') || {}).id : z.qs[0].ids[z.qs[0].a];
  const w = document.createElement('div'); w.className = 'wrap qr';
  const lastName = LS.get('lastName', '');
  const wrong = z.qs.map((x, k) => z.res[k] ? '' : `<div><b>${esc(x.q)}</b><br>정답: ${esc(x.o[x.a])}</div>`).join('');
  w.innerHTML = `${star && P[star] ? `<div class="stamp">${avHTML(P[star], 200)}</div>` : ''}<div class="big">${z.score}점</div><div class="msg">${n}문제 중 ${right}문제 정답 · ${msg}</div>
    <form id="hofForm"><input id="hofName" maxlength="10" placeholder="이름을 새겨 주세요" value="${esc(lastName)}" autocomplete="off"><button class="pillbtn navy" type="submit">이름 새기기</button></form>
    <div id="hofBox"></div>
    <div class="row"><button class="pillbtn pri" id="qAgain">다시 풀기</button>${z.mode.startsWith('ch') && z.cfg.n < BOOK.length ? `<button class="pillbtn" id="qNextCh">${z.cfg.n + 1}장 읽으러 가기</button>` : ''}<button class="pillbtn" id="qHome">퀴즈 처음으로</button></div>
    ${wrong ? `<div class="wrong"><h4>틀린 문제 다시 보기</h4>${wrong}</div>` : ''}`;
  quizBody.innerHTML = ''; quizBody.appendChild(w); hydrateAv(w); quizBody.scrollTop = 0;
  $('#hofBox').innerHTML = `<div class="hof">${hofList(z.mode)}</div>`;
  $('#hofForm').onsubmit = e => {
    e.preventDefault();
    const name = $('#hofName').value.trim().slice(0, 10) || '이름 없는 영웅';
    LS.set('lastName', name);
    const hof = hofGet(); const l = hof[z.mode] || [];
    const d = new Date(); const at = Date.now();
    l.push({n:name, s:z.score, d:`${d.getMonth() + 1}/${d.getDate()}`, at});
    l.sort((a, b) => b.s - a.s || a.at - b.at); hof[z.mode] = l.slice(0, 10); LS.set('hof', hof);
    $('#hofForm').outerHTML = hof[z.mode].some(r => r.at === at) ? `<p class="msg">명예의 전당에 「${esc(name)}」 이름이 새겨졌어요!</p>` : `<p class="msg">아쉽게 10위 안에 들지 못했어요. 다시 도전해 봐요!</p>`;
    $('#hofBox').innerHTML = `<div class="hof">${hofList(z.mode, at)}</div>`;
    LS.set('hofTab', z.mode);
  };
  $('#qAgain').onclick = () => startQuiz(z.cfg);
  $('#qHome').onclick = () => drawQuizHome(z.mode);
  if($('#qNextCh')) $('#qNextCh').onclick = () => { quiz = null; openBook(z.cfg.n + 1); };
}
$('#quizClose').onclick = closeToGraph;
$('#quizHomeBtn').onclick = () => drawQuizHome();
$('#btnBook').onclick = () => openBook();
$('#btnQuiz').onclick = () => openQuiz();
$('#wBook').onclick = () => openBook();
$('#wQuiz').onclick = () => openQuiz();
document.addEventListener('keydown', e => { if(e.key === 'Escape' && (ovBook.classList.contains('on') || ovQuiz.classList.contains('on'))) closeToGraph(); });


/* ---------- 처음 방문 안내 (한 번만) ---------- */
function showTip2(text, target, place, done){
  const t = document.createElement('div'); t.className = 'tipb ' + (place === 'below' ? 'up' : 'down'); t.setAttribute('role', 'status');
  t.innerHTML = `<span>${text}</span><button type="button">알겠어요</button>`;
  document.body.appendChild(t);
  const r = target.getBoundingClientRect(), w = t.offsetWidth, h = t.offsetHeight;
  const cx = r.left + r.width / 2, left = Math.max(12, Math.min(innerWidth - w - 12, cx - w / 2));
  t.style.left = left + 'px'; t.style.setProperty('--ax', (cx - left) + 'px');
  t.style.top = (place === 'below' ? r.bottom + 12 : r.top - h - 12) + 'px';
  let closed = false; const close = () => { if(closed) return; closed = true; t.remove(); clearTimeout(tm); if(done) done(); };
  t.querySelector('button').onclick = close; const tm = setTimeout(close, 7000);
}
function firstVisitTips(){
  if(LS.get('tips', 0)) return; LS.set('tips', 1);
  setTimeout(() => {
    const c = document.querySelector('#graph .node.center'); if(!c) return;
    showTip2('다른 인물을 누르면 그 인물이 가운데로 와요. 두 손가락으로 확대할 수 있어요.', c, 'below', () => {
      if(innerWidth <= 900){ const g = document.querySelector('.panel .grab'); if(g && !panel.classList.contains('hidden')) showTip2('아래 창을 위로 끌어 올리면 이 인물의 이야기를 읽을 수 있어요.', g, 'above'); }
      else if(!panel.classList.contains('hidden')) showTip2('오른쪽에서 이 인물의 이야기와 관계를 읽을 수 있어요.', panel.querySelector('h2') || panel, 'below');
    });
  }, 1200);
}
/* ---------- 시작 ---------- */
const FEAT = ['zeus','heracles','athena','medusa','achilles','odysseus','poseidon','perseus','hades','persephone','oedipus','cerberus'];
$('#feat').innerHTML = FEAT.map(id => `<button data-go="${id}">${avHTML(P[id], 30)}${esc(P[id].ko)}</button>`).join('');
hydrateAv($('#feat'));
$('#feat').querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
wireAssets(document);
const start = decodeURIComponent(location.hash.slice(1));
if(!P[start] && start !== 'book' && start !== 'quiz') track('/', '첫 화면');
if(P[start]) go(start, false);
else if(start === 'book') openBook();
else if(start === 'quiz') openQuiz();
})();
